<!doctype html>
<!-- The 1920x1080 composition the promo video is captured from: the bar, and nothing else.
     Driven frame by frame by render.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(1400px 800px at 50% 50%, #20263a, #0b0d14 78%); position: relative; }
  load-bearing { position: absolute; left: 96px; top: 324px; width: 1680px; --lb-frame-width: 24px; }
</style>
</head>
<body>
  <load-bearing id="bar" once manual></load-bearing>
<script type="module">
  import { playSound } from '../loadbearing.js';
  const FPS = 60;
  const L = document.getElementById('bar').loader;
  L.fade = 0;

  // The "download": a brisk start, the connection drops, then a sprint to the end. [seconds, progress]
  const CURVE = [[0, 0], [0.2, 0.04], [5, 0.36], [7, 0.44], [11.2, 0.44], [16.2, 1]];
  const progressAt = (t) => {
    for (let i = 1; i < CURVE.length; i++) if (t <= CURVE[i][0]) { const a = CURVE[i - 1], b = CURVE[i]; return a[1] + (b[1] - a[1]) * ((t - a[0]) / (b[0] - a[0])); }
    return 1;
  };
  // A few unprompted moments of life (the same thing a tap does), in sim seconds.
  const TAPS = [
    { t: 3.4, at: () => [L.barge.x + 40, 58] },
    { t: 9.6, at: () => [L.dog.x, 38] },
    { t: 13.6, at: () => [150, 58] },
  ];
  let arrivedAt = null, steps = 0;
  L.on('arrived', () => (arrivedAt = L.t));

  // Render video frame n (call with n = 0, 1, 2, … in order).
  window.renderFrame = (n) => {
    while (steps < n) {
      const before = L.t;
      L.setProgress(progressAt(L.t));
      L.step(1 / FPS);
      steps++;
      for (const tap of TAPS) if (before < tap.t && L.t >= tap.t) L.tap(...tap.at());
    }
    L.draw();
    return { t: L.t, percent: L.percent, arrivedAt };
  };

  // Offline-render the soundtrack from the sim's event log; returns base64 16-bit WAV.
  window.renderAudio = async (seconds) => {
    const sr = 44100, ac = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr);
    const master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp).connect(ac.destination);
    for (const e of L.events) playSound(ac, master, e.type, e.t, e.data);
    const buf = await ac.startRendering(), n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
    out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
    str(36, 'data'); out.setUint32(40, n * 4, true);
    const l = buf.getChannelData(0), r = buf.getChannelData(1);
    for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, l[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, r[i])) * 32767, true); }
    let bin = ''; const bytes = new Uint8Array(out.buffer);
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.ready = true;
</script>
</body>
</html>
