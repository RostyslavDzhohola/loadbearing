<!doctype html>
<!-- The 1080x1080 composition the promo video is captured from. Driven frame by frame by render.mjs.
     Top: a 12x close-up that follows the action. Below: the whole bar at 4x. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: radial-gradient(900px 700px at 50% 40%, #1d2335, #0b0d14 75%);
    color: #eef1f7; font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    position: relative;
  }
  #hook { position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 56px; font-weight: 780; letter-spacing: -0.022em; line-height: 1.1; }
  #hook em { font-style: normal; color: #f7c531; }
  #zoom { position: absolute; left: 36px; top: 196px; width: 1008px; height: 432px; border-radius: 40px; image-rendering: pixelated;
    box-shadow: 0 0 0 6px #2a3145, 0 30px 60px -20px rgba(0,0,0,.7); }
  load-bearing { position: absolute; left: 16px; top: 668px; width: 1024px; --lb-frame-width: 12px; }
  #lens { position: absolute; border: 3px solid #fff; border-radius: 8px; box-shadow: 0 0 0 2px rgba(0,0,0,.45); pointer-events: none; }
  #status { position: absolute; top: 972px; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  #card { position: absolute; left: 0; right: 0; top: 652px; bottom: 0; opacity: 0; text-align: center; background: #0b0d14; padding-top: 34px; }
  #card .name { font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  #card .url { font-size: 44px; color: #f7c531; margin-top: 26px; font-weight: 650; }
  #card .how { font-size: 32px; color: #aeb6c8; margin-top: 40px; font-variant-numeric: tabular-nums; }
  #card .how b { color: #fff; font-weight: 650; }
  #cursor { position: absolute; left: 0; top: 0; width: 72px; height: 72px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
  #ring { position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 8px solid #fff; opacity: 0; }
</style>
</head>
<body>
  <div id="hook">The loading bar that takes a<br><em>coffee break</em> when your Wi‑Fi does.</div>
  <canvas id="zoom" width="1008" height="432"></canvas>
  <load-bearing id="bar" once manual></load-bearing>
  <div id="lens"></div>
  <div id="status"></div>
  <div id="card">
    <div class="name">loadbearing</div>
    <div class="url">github.com/RostyslavDzhohola/loadbearing</div>
    <div class="how">Free and open source. Code, pixel art, sound and<br>this video by <b>Claude Fable 5.2</b> · <span id="stats"></span></div>
  </div>
  <div id="ring"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.5L8 20z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
<script type="module">
  import { playSound } from '../loadbearing.js';
  const q = new URLSearchParams(location.search);
  const FPS = 60;
  const bar = document.getElementById('bar'), L = bar.loader;
  const $ = (id) => document.getElementById(id);
  const zoom = $('zoom'), zg = zoom.getContext('2d');
  zg.imageSmoothingEnabled = false;
  const Z = 12, VW = 84, VH = 36;               // close-up: 84x36 logical pixels at 12x
  const ZX = 36, ZY = 196;                      // close-up origin on the page
  const PX = 16 + 12, PY = 668 + 12, PS = 4;    // whole-bar canvas origin and scale
  $('stats').textContent = q.get('stats') || 'one prompt · one session';
  L.fade = 0;

  // The "download": a brisk start, the Wi-Fi drops, then a sprint to the end. [seconds, progress]
  const CURVE = [[0, 0], [0.2, 0.04], [5, 0.36], [7, 0.44], [11.2, 0.44], [16.2, 1]];
  const progressAt = (t) => {
    for (let i = 1; i < CURVE.length; i++) if (t <= CURVE[i][0]) { const a = CURVE[i - 1], b = CURVE[i]; return a[1] + (b[1] - a[1]) * ((t - a[0]) / (b[0] - a[0])); }
    return 1;
  };

  // Scripted taps, in sim seconds. `at` returns logical canvas coordinates.
  const TAPS = [
    { t: 1.3, at: () => [L.crew[0].x, 35] },
    { t: 3.5, at: () => [L.barge.x + 34, 58] },
    { t: 5.7, at: () => [L.bal.x, 13] },
    { t: 9.7, at: () => [L.dog.x, 38] },
    { t: 13.4, at: () => [L.bal.x - 30, 14] },
  ];
  const cam = { x: 42, y: 17 };
  let arrivedAt = null, steps = 0;
  L.on('arrived', () => (arrivedAt = L.t));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function label() {
    const p = L.percent;
    if (p >= 100) return ['100% · All aboard!', '#f7c531'];
    if (L.stalled) return [`${p}% · Wi‑Fi dropped. Coffee break.`, '#ff8f8f'];
    return [`${p}% · ${p < 30 ? 'Laying the groundwork…' : p < 60 ? 'Bridging the gap…' : p < 90 ? 'Spanning the last stretch…' : 'Almost there…'}`, '#eef1f7'];
  }

  // Render video frame n (call with n = 0, 1, 2, … in order).
  window.renderFrame = (n) => {
    while (steps < n) {
      const before = L.t;
      L.setProgress(progressAt(L.t));
      L.step(1 / FPS);
      steps++;
      for (const tap of TAPS) if (before < tap.t && L.t >= tap.t) { tap.hit = tap.at(); L.tap(...tap.hit); }
    }
    L.draw();
    const t = L.t;

    // Camera: follow the crew, cut to whatever is being tapped, ride with the train at the end.
    const crewX = L.crew.reduce((a, c) => a + c.x, 0) / 3;
    let tx = crewX + (L.stalled || L.finale ? 0 : 8), ty = 17, k = 0.07, tapNow = null;
    if (L.finale?.phase === 1) { tx = L.train.x - 26; ty = 7; k = 0.1; }
    else if (L.finale?.phase === 2) { tx = 214; ty = 7; }
    for (const tap of TAPS) if (t > tap.t - 0.9 && t < tap.t + 1.0) {
      tapNow = tap;
      const [x, y] = tap.hit || tap.at();
      tx = x; ty = y - 18; k = 0.14;
    }
    cam.x += (clamp(tx, VW / 2, 256 - VW / 2) - cam.x) * k;
    cam.y += (clamp(ty, 0, 64 - VH) - cam.y) * k;
    const sx = Math.round((cam.x - VW / 2) * Z) / Z, sy = Math.round(cam.y * Z) / Z;
    zg.drawImage(L.c, sx, sy, VW, VH, 0, 0, VW * Z, VH * Z);
    Object.assign($('lens').style, { left: PX + sx * PS - 3 + 'px', top: PY + sy * PS - 3 + 'px', width: VW * PS + 'px', height: VH * PS + 'px' });

    // The cursor only shows up to tap.
    let ca = 0, cp = [0, 0], ra = 0, rs = 0;
    if (tapNow) {
      const dt = t - tapNow.t, [x, y] = tapNow.hit || tapNow.at();
      const to = [ZX + (x - sx) * Z, ZY + (y - sy) * Z];
      if (dt < 0) { const u = 1 + dt / 0.9, e = u * u * (3 - 2 * u); ca = Math.min(1, u * 4); cp = [to[0] + (1 - e) * 160, to[1] + (1 - e) * 120]; }
      else { ca = clamp((0.8 - dt) * 4, 0, 1); cp = to; if (dt < 0.5) { ra = 1 - dt / 0.5; rs = 0.25 + dt * 1.7; } }
      Object.assign($('ring').style, { transform: `translate(${to[0]}px, ${to[1]}px) scale(${rs})`, opacity: ra });
    } else $('ring').style.opacity = 0;
    Object.assign($('cursor').style, { transform: `translate(${cp[0] - 14}px, ${cp[1] - 6}px)`, opacity: ca });

    const [text, color] = label();
    $('status').textContent = text;
    $('status').style.color = color;
    const c = arrivedAt === null ? 0 : clamp((t - arrivedAt - 0.5) / 0.5, 0, 1);
    $('card').style.opacity = c;
    return { t, percent: L.percent, arrivedAt };
  };

  // Offline-render the soundtrack from the sim's event log; returns base64 16-bit WAV.
  window.renderAudio = async (seconds) => {
    const sr = 44100, ac = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr);
    const master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp).connect(ac.destination);
    for (const e of L.events) playSound(ac, master, e.type, e.t, e.data);
    const buf = await ac.startRendering(), n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
    out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
    str(36, 'data'); out.setUint32(40, n * 4, true);
    const l = buf.getChannelData(0), r = buf.getChannelData(1);
    for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, l[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, r[i])) * 32767, true); }
    let bin = ''; const bytes = new Uint8Array(out.buffer);
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.ready = true;
</script>
</body>
</html>
